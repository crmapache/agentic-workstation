# Сайт Agentic Workstation. HTTPS снимает Traefik перед контейнером, сюда приходит обычный HTTP.

# Последний выпуск с GitHub (/release.json ниже): ответ API общий для всех посетителей и живёт
# здесь 10 минут. Без этого каждый посетитель спрашивал бы API сам, а лимит у GitHub - 60
# запросов в час на адрес: из офиса за одним адресом номер версии пропадал бы.
proxy_cache_path /var/cache/nginx/release levels=1 keys_zone=release:1m max_size=10m
                 inactive=30d use_temp_path=off;

server {
    listen 3026;
    listen [::]:3026;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Редирект /path -> /path/ относительным адресом: абсолютный nginx собрал бы из своего
    # порта и схемы (http://...:3026/path/), а снаружи сайт живёт на https без порта.
    absolute_redirect off;
    server_tokens off;

    # Журнала посещений нет: политика сайта (/privacy/) обещает, что адреса посетителей не
    # пишутся. Отсутствующий файл - обычный 404, а не ошибка: в журнал ошибок он не идёт.
    access_log off;
    log_not_found off;

    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml
                  text/xml;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml
               text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;

    # Страница - без кеша: ссылки на картинки и скрипт в ней меняются с каждой выкладкой.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Всё, что собрал Vite, - с хешем в имени: новая выкладка даёт новые имена, кеш вечный.
    location /assets/ {
        expires max;
    }

    # Значки и превью ссылки живут по постоянным адресам: сутки кеша.
    location ~* ^/[^/]+\.(?:png|ico|svg)$ {
        expires 1d;
    }

    # Отпечаток сборки: по нему скрипт выкладки узнаёт, что отвечает новый контейнер, и по
    # нему же Coolify проверяет здоровье.
    location = /version.txt {
        expires -1;
    }

    # Номер последней версии и размеры установщиков для страницы (src/release.ts). Имя хоста -
    # через переменную и резолвер докера: адрес из конфига nginx разрешает при старте, и без
    # DNS в эту секунду контейнер не поднялся бы вовсе. GitHub не ответил или упёрся в лимит -
    # отдаётся последний удачный ответ.
    location = /release.json {
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $github api.github.com;
        proxy_pass https://$github/repos/crmapache/agentic-workstation-releases/releases/latest;
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_set_header Host api.github.com;
        proxy_set_header Accept application/vnd.github+json;
        proxy_set_header User-Agent agentic-workstation-site;
        proxy_set_header Cookie "";

        proxy_cache release;
        proxy_cache_key release-latest;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502
                              http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-GitHub-Request-Id;
        proxy_hide_header X-GitHub-Media-Type;
        proxy_hide_header X-GitHub-Api-Version-Selected;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-RateLimit-Limit;
        proxy_hide_header X-RateLimit-Remaining;
        proxy_hide_header X-RateLimit-Used;
        proxy_hide_header X-RateLimit-Reset;
        proxy_hide_header X-RateLimit-Resource;
        expires 5m;
    }
}
