<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Иконка Agentic Workstation: приглашение строки ввода и звёздочка ИИ. Исходник; icon.icns и icon.png собирает scripts/make-icon.sh. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1D21"/><stop offset="1" stop-color="#060607"/></linearGradient>
<radialGradient id="glow" cx=".45" cy=".55" r=".55"><stop offset="0" stop-color="#F26A2E" stop-opacity=".34"/><stop offset="1" stop-color="#F26A2E" stop-opacity="0"/></radialGradient>
<linearGradient id="ember" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC9A3"/><stop offset=".45" stop-color="#FF8A52"/><stop offset="1" stop-color="#D9561F"/></linearGradient>
