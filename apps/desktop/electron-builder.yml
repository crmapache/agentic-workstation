appId: io.github.crmapache.agenticworkstation
productName: Agentic Workstation
copyright: Copyright © crmapache

# Имя пакета внутри сборки. Установщик Windows на одного человека берёт папку по нему, а не по
# productName (electron-builder, oneClick): с именем пакета монорепо это была бы
# `Programs\@agentic-workstationdesktop`. Имя окна, папки данных и меню остаются от productName.
extraMetadata:
  name: agentic-workstation

directories:
  output: dist
  # Не build/: это имя часто сидит в глобальных .gitignore, а файл entitlements,
  # который git отказывается хранить, на свежем клоне просто пропадает.
  buildResources: packaging

# Убирает распакованные каталоги сборки, когда установщики уже собраны: иначе
# внутри проекта лежит второй Agentic Workstation.app, и Spotlight показывает его наравне
# с установленным. Оставить каталог - AGENTIC_WORKSTATION_KEEP_UNPACKED=1.
afterAllArtifactBuild: ./scripts/clean-unpacked.cjs

# Подпись бандла сертификатом проекта - до сборки dmg и zip (см. mac.identity ниже).
afterPack: ./scripts/sign-app.cjs

# Установщик Windows собирается на Маке (ADR 0048). Старый NSIS у electron-builder (3.0.4.1)
# несёт makensis только под Intel и без Rosetta падает с «Bad CPU type»; набор 1.2.1 - NSIS 3.12
# со своим makensis под Apple Silicon, качается сам при первой сборке. Wine не нужен.
toolsets:
  nsis: '1.2.1'

# Внутрь приложения едет только то, что собрал electron-vite. React, дизайн-система
# и прочее, что нужно окну, уже вшито в бандл рендерера - отсюда они в devDependencies.
# Рантайм-зависимости главного процесса (dependencies) electron-builder кладёт сам.
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # Браузер для ИИ (ADR 0040): host и расширение едут ресурсами (ниже), не внутрь app.asar -
  # IDE копирует их в ~/.agentic-workstation, а из архива их не скопировать обычным fs.
  - '!out/native-host/**'
  - '!out/chrome-extension/**'
  # Терминал (ADR 0037): node-pty везёт готовые бинарники всех платформ, отладочные символы
  # Windows (десятки мегабайт) и исходники для node-gyp. В сборку - только бинарники своей
  # платформы: чужие отсекают mac.files и win.files ниже (они добавляются к общим).
  - '!**/node_modules/node-pty/prebuilds/linux-*/**'
  - '!**/node_modules/node-pty/prebuilds/**/*.pdb'
  - '!**/node_modules/node-pty/{src,third_party,scripts}/**'
  - '!**/node_modules/node-pty/binding.gyp'

# Браузер для ИИ (ADR 0040): native host (исполняет сам бинарник IDE как Node) и собранное
# расширение Chrome - в Contents/Resources. Их собирает electron-vite build (плагин
# browserBridgePlugin), расширение - скрипт build до неё.
extraResources:
  - from: out/native-host
    to: native-host
  - from: out/chrome-extension
    to: chrome-extension

# Нативный модуль терминала и его помощники (spawn-helper на маке, conpty на Windows) - вне
# app.asar: процесс из архива не запустить, а node-pty сам ищет их в app.asar.unpacked. Что
# распаковать - у каждой платформы своё (mac.asarUnpack, win.asarUnpack).

asar: true

# Нативные модули главного процесса (koffi, node-pty) - на Node-API с готовыми бинарниками
# в пакетах: под версию Electron их пересобирать не нужно. Иначе electron-builder собирает
# node-pty из исходников через node-gyp, а это требует исправных Command Line Tools и без них
# роняет сборку (ADR 0037).
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  darkModeSupport: true

  files:
    - '!**/node_modules/node-pty/prebuilds/win32-*/**'
    - '!**/node_modules/node-pty/prebuilds/darwin-x64/**'
  asarUnpack:
    - '**/node_modules/node-pty/prebuilds/darwin-arm64/**'

  # Только Apple Silicon: IDE делается под конкретные машины, а universal удвоил бы
  # размер ради Intel, на котором её никто не запускает.
  #
  # zip нужен не для людей, а для обновления: приложение качает его само и
  # подменяет себя (см. docs/adr/0004-self-update.md). dmg - для первой установки.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

  # Фиксированные имена без версии: под ними файлы и публикуются, а сайт и
  # манифест обновлений ссылаются на них, не зная версии заранее.
  artifactName: agentic-workstation-mac-${arch}.${ext}

  # Подписывает не electron-builder, а наш хук scripts/sign-app.cjs - самоподписанным
  # сертификатом «Agentic Workstation Code Signing» (Developer ID нет, как в snakein).
  #
  # Сертификат не убирает предупреждение Gatekeeper при первой установке, зато даёт
  # приложению устойчивую подпись: правило, по которому macOS узнаёт «то же самое
  # приложение», привязано к сертификату, а не к хешу сборки. На этом держится
  # самообновление. Встроенная подпись electron-builder требует доверия к
  # сертификату, а его macOS выдаёт только через окно с паролем - хуку оно не нужно.
  # См. docs/code-signing.md.
  #
  # `pnpm dist` подписывает обязательно, `pnpm dist:local` оставляет подпись ad-hoc.
  identity: null

  # Hardened runtime нужен только для нотаризации, а нотаризовать нечем: она
  # требует Developer ID. С самоподписанным сертификатом он ещё и включает проверку
  # библиотек, из-за которой приложение может не запуститься вовсе.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist

# Windows (ADR 0048): только x64, установщик NSIS на одного человека - без прав
# администратора, в %LOCALAPPDATA%\Programs. Им же приложение обновляется само: качает
# новый установщик и запускает его тихо (main/updates/win-update.ts). Портативного exe нет: он
# распаковывает себя во временную папку на каждом запуске, а IDE должна открываться быстро.
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: agentic-workstation-win-${arch}.${ext}
  files:
    - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
    - '!**/node_modules/node-pty/prebuilds/win32-arm64/**'
  asarUnpack:
    - '**/node_modules/node-pty/prebuilds/win32-x64/**'

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agentic Workstation
  runAfterFinish: true
  # Данные IDE (проекты, разговоры, история файлов) переживают удаление: переустановка не
  # должна стирать работу. Чистый лист - скилл /reinstall с clean.
  deleteAppDataOnUninstall: false

dmg:
  title: Agentic Workstation
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Публикацию делает скилл /build через gh, а не electron-builder: так релиз
# создаётся только после проверки подписи, а не сам по себе на каждой сборке.
publish: null
