<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Стрелка ИИ Computer Use (ADR 0079): своя крошечная страница в окне поверх всех приложений,
      которое едет за рукой. Правила те же, что у окна IDE: только свои скрипты и стили.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" />
    <title>Computer Use pointer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/pointer.tsx"></script>
  </body>
</html>
