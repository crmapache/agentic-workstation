packages:
  - apps/*
  - packages/*

# pnpm не запускает postinstall зависимостей без явного разрешения.
# Разрешаем только тем, кому сборка действительно нужна.
#
# Electron здесь нет намеренно: с 43-й версии он не качает бинарник на установке,
# а electron-vite и electron-builder без бинарника падают. Его ставит postinstall
# самого apps/desktop (scripts/install-electron.mjs).
allowBuilds:
  esbuild: true # нативный бинарник сборщика, без него не собирается ничего
  electron-winstaller: false # Windows пока не собираем
  unrs-resolver: true # нативный резолвер eslint-import-resolver-typescript
  '@parcel/watcher': false # вотчер sass для CLI-режима, сборка через Vite его не использует
  # FFI главного процесса. Готовый бинарник приходит пакетом @koromix/koffi-<система>-<процессор>,
  # а скрипт установки лишь перепроверяет его и без него собирал бы из исходников CMake.
  koffi: false
  # Терминал IDE. Готовые бинарники для macOS лежат в самом пакете (prebuilds/darwin-arm64),
  # их находит загрузчик пакета; скрипт установки только проверяет их, а без них собирал бы
  # из исходников через node-gyp.
  node-pty: false

# Установщик Windows собирается на маке (ADR 0048). Нативные части зависимостей приходят
# пакетами под каждую систему (koffi - @koromix/koffi-win32-x64 и т.п.), а pnpm по умолчанию
# ставит только пакеты своей машины: сборка Windows увозила бы маковый бинарник koffi, и мышь,
# клавиатура и замер памяти там не грузились бы (ADR 0058). Ставим и пакеты Windows x64.
supportedArchitectures:
  os: [current, win32]
  cpu: [current, x64]

# Свежие версии, которые pnpm по умолчанию придержал бы как слишком новые. Взяты
# осознанно при создании проекта - это последние стабильные на тот момент.
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.3'
  - '@tanstack/react-query@5.104.3'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - i18next@26.4.6
  - react-i18next@17.0.18
  - sass@1.105.2
  - vitest@5.0.5
  - smooth-stream-text@0.2.2
